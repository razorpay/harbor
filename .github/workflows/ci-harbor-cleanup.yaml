name: Harbor Cleanup Tool
on:
  push:
    paths:
      - .github/workflows/ci-harbor-cleanup.yaml
      - 'harbor-cleanup/**'

jobs:
  build-harbor-cleanup:
    runs-on: ubuntu-latest
    name: Build Harbor Cleanup Tool image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: c.rzp.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      - name: Build and push
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v5
        with:
          context: tools/harbor-cleanup
          file: tools/harbor-cleanup/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: c.rzp.io/razorpay/harbor-cleanup:${{ (github.ref_name == 'master' && github.sha) || format('test-{0}', github.sha) }}
          cache-from: type=registry,ref=c.rzp.io/razorpay/harbor-cleanup:buildcache
          cache-to: type=registry,ref=c.rzp.io/razorpay/harbor-cleanup:buildcache,mode=max
