# Build multi-arch Harbor images and push to a container registry (e.g. ECR).
# Image pattern: <registry>/<harbor_service>:<tag>
#
# Configure in repo: Settings > Secrets and variables > Actions
#
# Variables:
#   ECR_REGISTRY  - registry host
#   AWS_REGION    - optional
#   AWS_ROLE_ARN  - IAM role ARN for OIDC (e.g. arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME)

name: Build and Push Harbor Images

on:
  push:
    branches:
      - main
      - main_v2.11.0
      - 'release-*'
  pull_request:
    branches:
      - main
      - main_v2.11.0
      - 'release-*'
      - 'fix/gc-optimization'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: git ref or sha)'
        required: false

env:
  PLATFORMS: linux/amd64,linux/arm64
  BASE_IMAGE_TAG: base
  GOLANG_IMAGE: golang:1.22.3

jobs:
  compile-binaries:
    name: Compile Go binaries
    runs-on: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.3'

      - name: Generate API (models + restapi from swagger)
        run: |
          # models/ and restapi/ are gitignored - must be generated before compiling core
          go install github.com/go-swagger/go-swagger/cmd/swagger@v0.25.0
          rm -rf src/server/v2.0/models src/server/v2.0/restapi
          mkdir -p src/server/v2.0
          swagger generate server \
            -f api/v2.0/swagger.yaml \
            -A harbor \
            -t src/server/v2.0 \
            --template-dir=tools/swagger/templates \
            --exclude-main \
            --skip-validation \
            --additional-initialism=CVE \
            --additional-initialism=GC \
            --additional-initialism=OIDC

      - name: Compile core (amd64 + arm64)
        run: |
          cd src
          export GOOS=linux
          GITCOMMIT=$(git rev-parse --short=8 HEAD)
          RELEASEVERSION=$(cat ../VERSION 2>/dev/null || echo "dev")
          LDFLAGS="-w -s -X github.com/goharbor/harbor/src/pkg/version.GitCommit=$GITCOMMIT -X github.com/goharbor/harbor/src/pkg/version.ReleaseVersion=$RELEASEVERSION"
          for arch in amd64 arm64; do
            GOARCH=$arch go build -ldflags "$LDFLAGS" -o ../make/photon/core/harbor_core-linux-$arch -buildvcs=false ./core
          done

      - name: Compile jobservice (amd64 + arm64)
        run: |
          cd src
          export GOOS=linux
          for arch in amd64 arm64; do
            GOARCH=$arch go build -o ../make/photon/jobservice/harbor_jobservice-linux-$arch -buildvcs=false ./jobservice
          done

      - name: Compile registryctl (amd64 + arm64)
        run: |
          cd src
          export GOOS=linux
          for arch in amd64 arm64; do
            GOARCH=$arch go build -o ../make/photon/registryctl/harbor_registryctl-linux-$arch -buildvcs=false ./registryctl
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: harbor-binaries
          # Upload directories so path structure is preserved (make/photon/core/, etc.)
          path: |
            make/photon/core/
            make/photon/jobservice/
            make/photon/registryctl/

  build-registry-binary:
    name: Build registry binary
    runs-on: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build registry binaries (amd64 + arm64)
        run: |
          chmod +x make/photon/registry/builder
          make/photon/registry/builder v2.8.3
        env:
          REGISTRY_SRC_TAG: v2.8.3

      - name: Upload registry binaries
        uses: actions/upload-artifact@v4
        with:
          name: registry-binaries
          path: make/photon/registry/binary/

  build-and-push:
    name: Build and push images
    runs-on: ["ubuntu-latest"]
    needs: [compile-binaries, build-registry-binary]
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Validate registry config
        run: |
          if [ -z "${{ vars.ECR_REGISTRY }}" ]; then
            echo "::error::ECR_REGISTRY is not set. Add it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN is not set. Add it in Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set image tag
        run: |
          # Harbor version from VERSION file (e.g. v2.11.0 -> 2.11.0), fallback to 2.11.0
          version="2.11.0"
          if [ -f VERSION ]; then
            version=$(sed 's/^v//' VERSION | tr -d '\n')
          fi
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=${version}-${short_sha}" >> $GITHUB_ENV
          echo "Using image tag: ${version}-${short_sha}"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: harbor-binaries

      - name: Place binaries for Docker build
        run: |
          # Ensure target dirs exist
          mkdir -p make/photon/core make/photon/jobservice make/photon/registryctl
          # Artifact may extract as harbor-binaries/{core,jobservice,registryctl}/ or as {core,jobservice,registryctl}/ at root
          for src in "harbor-binaries" "."; do
            [ -d "$src/core" ] && cp -fv $src/core/harbor_core-linux-* make/photon/core/ 2>/dev/null || true
            [ -d "$src/jobservice" ] && cp -fv $src/jobservice/harbor_jobservice-linux-* make/photon/jobservice/ 2>/dev/null || true
            [ -d "$src/registryctl" ] && cp -fv $src/registryctl/harbor_registryctl-linux-* make/photon/registryctl/ 2>/dev/null || true
          done
          # If flattened: binaries at workspace root
          [ -f harbor_core-linux-amd64 ] && cp -fv harbor_core-linux-* make/photon/core/
          [ -f harbor_jobservice-linux-amd64 ] && cp -fv harbor_jobservice-linux-* make/photon/jobservice/
          [ -f harbor_registryctl-linux-amd64 ] && cp -fv harbor_registryctl-linux-* make/photon/registryctl/
          ls -la make/photon/core/ make/photon/jobservice/ make/photon/registryctl/

      - name: Verify binaries
        run: |
          for f in make/photon/core/harbor_core-linux-amd64 make/photon/core/harbor_core-linux-arm64 \
                    make/photon/jobservice/harbor_jobservice-linux-amd64 make/photon/jobservice/harbor_jobservice-linux-arm64 \
                    make/photon/registryctl/harbor_registryctl-linux-amd64 make/photon/registryctl/harbor_registryctl-linux-arm64; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All binaries present."

      - name: Download registry binaries
        uses: actions/download-artifact@v4
        with:
          name: registry-binaries
          path: make/photon/registry/binary/

      - name: Generate prepare versions file
        run: |
          mkdir -p make/photon/prepare
          echo "VERSION_TAG: ${{ env.IMAGE_TAG }}" > make/photon/prepare/versions
          echo "REGISTRY_VERSION: v2.8.3-patch-redis" >> make/photon/prepare/versions
          echo "TRIVY_VERSION: v0.51.2" >> make/photon/prepare/versions
          echo "TRIVY_ADAPTER_VERSION: v0.31.2" >> make/photon/prepare/versions

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push base images
        run: |
          set -e
          for comp in core jobservice registry registryctl; do
            echo "Building base: harbor-$comp-base"
            docker buildx build \
              --platform ${{ env.PLATFORMS }} \
              -f make/photon/$comp/Dockerfile.base \
              -t ${{ env.ECR_REGISTRY }}/harbor-$comp-base:${{ env.BASE_IMAGE_TAG }} \
              --push \
              .
          done

      - name: Build and push harbor-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: make/photon/core/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/harbor-core:${{ env.IMAGE_TAG }}
          build-args: |
            harbor_base_image_version=${{ env.BASE_IMAGE_TAG }}
            harbor_base_namespace=${{ env.ECR_REGISTRY }}

      - name: Build and push harbor-jobservice
        uses: docker/build-push-action@v6
        with:
          context: .
          file: make/photon/jobservice/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/harbor-jobservice:${{ env.IMAGE_TAG }}
          build-args: |
            harbor_base_image_version=${{ env.BASE_IMAGE_TAG }}
            harbor_base_namespace=${{ env.ECR_REGISTRY }}

      - name: Build and push registry-photon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: make/photon/registry/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/registry-photon:${{ env.IMAGE_TAG }}
          build-args: |
            harbor_base_image_version=${{ env.BASE_IMAGE_TAG }}
            harbor_base_namespace=${{ env.ECR_REGISTRY }}

      - name: Build and push harbor-registryctl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: make/photon/registryctl/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/harbor-registryctl:${{ env.IMAGE_TAG }}
          build-args: |
            harbor_base_image_version=${{ env.BASE_IMAGE_TAG }}
            harbor_base_namespace=${{ env.ECR_REGISTRY }}

      - name: Summary
        run: |
          echo "## Images pushed to ${{ env.ECR_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          for svc in harbor-core harbor-jobservice registry-photon harbor-registryctl; do
            echo "| $svc | \`${{ env.ECR_REGISTRY }}/$svc:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          done
